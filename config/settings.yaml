# 数据源配置
data_sources:
  tushare:
    api_key: "YOUR_TUSHARE_TOKEN"
    timeout: 30
  akshare:
    enabled: true

# 数据存储配置
storage:
  type: "local"
  path: "./data"
  cache_ttl: 86400  # 缓存时间(秒)

# 回测配置
backtest:
  initial_capital: 100000
  commission: 0.0003  # 手续费率
  slippage: 0.0001    # 滑点
  benchmark: "000300.SH"

# 日志配置
logging:
  level: "INFO"
  file: "./logs/trading.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"